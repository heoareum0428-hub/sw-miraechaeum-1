<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1차시 | 우리가 만들고 싶은 인공지능</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #52616b; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 10px; }
        
        .worksheet-container { width: 800px; background: #ffffff; border-radius: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); padding: 35px 35px; border: 2px solid #2c3e50; display: flex; flex-direction: column; gap: 14px; }
        
        /* 상단 프로필 및 헤더 */
        .header-box { border: 2px solid #2c3e50; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; background-color: #ffffff; }
        .header-title-box { display: flex; align-items: center; gap: 12px; }
        .header-badge { font-weight: 800; font-size: 22px; color: #2c3e50; background: #ecf0f1; padding: 4px 10px; border-radius: 6px; }
        .header-main-title { font-size: 22px; font-weight: bold; color: #111; border-left: 3px solid #2c3e50; padding-left: 12px; }
        
        .header-info-box { border: 1.5px solid #2c3e50; padding: 8px 12px; border-radius: 4px; background-color: #fafafa; display: flex; flex-direction: column; gap: 5px; width: 220px; }
        .info-row { display: flex; align-items: center; justify-content: flex-end; font-size: 13px; font-weight: bold; color: #2c3e50; gap: 4px; }
        .info-input { border: none; border-bottom: 1.5px solid #2c3e50; outline: none; text-align: center; font-size: 13px; font-weight: bold; font-family: inherit; background: transparent; padding: 1px 0; }

        .instruction-title { font-size: 16px; font-weight: bold; color: #2c3e50; border-left: 5px solid #3498db; padding-left: 10px; }

        /* 보기 란 */
        .example-box { border: 2px solid #2c3e50; border-radius: 6px; overflow: hidden; background-color: #fff; }
        .example-header { background-color: #34495e; color: #ffffff; padding: 3px 0; text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
        .example-content { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; background-color: #f8f9fa; }
        .example-item { background-color: #ffffff; border: 1.5px solid #bdc3c7; border-radius: 6px; padding: 6px 4px; text-align: center; }
        .example-item-title { font-weight: bold; color: #2980b9; margin-bottom: 2px; font-size: 14px; }
        .example-item-desc { font-size: 11px; color: #444; line-height: 1.3; font-weight: 500; word-break: keep-all; }

        /* 메인 활동 표 */
        .activity-table { width: 100%; border-collapse: collapse; border: 2px solid #2c3e50; table-layout: fixed; }
        .activity-table th, .activity-table td { border: 1.5px solid #2c3e50; text-align: center; vertical-align: middle; }
        .activity-table th { background-color: #eaeded; font-size: 16px; font-weight: bold; padding: 8px; color: #2c3e50; }
        
        /* 예시 열 정렬 높이 */
        .example-row { height: 180px; }
        .example-row td { padding: 10px; }
        .example-img-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .example-img-container img { max-width: 100px; max-height: 90px; object-fit: contain; }
        .example-img-label { font-weight: bold; font-size: 14px; color: #2c3e50; }
        .example-text-tech { font-weight: bold; font-size: 15px; color: #2c3e50; }
        .example-text-desc { font-size: 13.5px; color: #2c3e50; text-align: left; line-height: 1.6; font-weight: bold; text-align: justify; word-break: keep-all; }

        /* 학생 입력 셀 정렬 (수직/수평 완벽 대칭 구조) */
        .input-row { height: 320px; }
        .drawing-cell { padding: 8px; vertical-align: top; }
        
        .drawing-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; gap: 6px; }
        
        /* 툴바 이미지 배치 구조 맞춤 */
        .canvas-toolbar { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; }
        .color-picker { width: 18px; height: 18px; border: none; cursor: pointer; background: none; margin-right: 2px; }
        .toolbar-btn { padding: 3px 6px; font-size: 11px; font-weight: bold; border: 1.5px solid #2c3e50; background-color: #fff; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 2px; }
        .toolbar-btn.active { background-color: #2c3e50; color: #fff; }

        canvas { border: 1.5px dashed #bdc3c7; background-color: #fff; cursor: crosshair; border-radius: 4px; touch-action: none; }

        .text-cell { padding: 10px; vertical-align: top; }
        .text-input-area { width: 100%; height: 100%; border: none; outline: none; resize: none; font-family: inherit; font-size: 14.5px; line-height: 1.6; background: transparent; text-align: justify; word-break: break-all; }
        .text-input-area::placeholder { color: #bdc3c7; font-style: italic; font-size: 13px; text-align: left; }

        /* 제출 버튼 */
        .action-bar { display: flex; justify-content: center; margin-top: 5px; }
        .submit-btn { background-color: #2980b9; color: white; border: none; padding: 12px 40px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #1f618d; }
    </style>
</head>
<body>

<div class="worksheet-container">
    <div class="header-box">
        <div class="header-title-box">
            <span class="header-badge">1차시</span>
            <span class="header-main-title">우리가 만들고 싶은 인공지능</span>
        </div>
        <div class="header-info-box">
            <div class="info-row">
                <input type="text" id="school" class="info-input" style="width: 100px;"> <span>초등학교</span>
            </div>
            <div class="info-row">
                <input type="text" id="grade" class="info-input" style="width: 35px;"> <span>학년</span>
                <input type="text" id="classNum" class="info-input" style="width: 35px; margin-left: 5px;"> <span>반</span>
            </div>
            <div class="info-row">
                <span>이름 :</span>
                <input type="text" id="name" class="info-input" style="width: 110px;">
            </div>
        </div>
    </div>

    <div class="instruction-title">
        생활 속에서 사용하고 있는 사물에 인공지능 기술을 적용한다면 어떤 점이 편리할까요?
    </div>

    <div class="example-box">
        <div class="example-header">보 기</div>
        <div class="example-content">
            <div class="example-item">
                <div class="example-item-title">음성 인식</div>
                <div class="example-item-desc">사람의 목소리나 소리를 듣고 이해하는 기술</div>
            </div>
            <div class="example-item">
                <div class="example-item-title">이미지 인식</div>
                <div class="example-item-desc">카메라로 사물, 얼굴, 공간을 알아보는 기술</div>
            </div>
            <div class="example-item">
                <div class="example-item-title">문자 인식</div>
                <div class="example-item-desc">글씨나 기호를 읽고 그 뜻을 파악하는 기술</div>
            </div>
            <div class="example-item">
                <div class="example-item-title">동작 인식</div>
                <div class="example-item-desc">사람의 몸짓이나 움직임을 감지하는 기술</div>
            </div>
        </div>
    </div>

    <table class="activity-table">
        <thead>
            <tr>
                <th style="width: 33%;">생활 속 사물</th>
                <th style="width: 27%;">적용할 인공지능 기술</th>
                <th style="width: 40%;">편리한 점</th>
            </tr>
        </thead>
        <tbody>
            <tr class="example-row">
                <td>
                    <div class="example-img-container">
                        <!-- 책상과 걸상 이미지 예시 (svg 렌더링) -->
                        <svg width="80" height="70" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="20" y="25" width="55" height="8" rx="2" fill="#7f8c8d"/>
                            <rect x="25" y="33" width="5" height="35" fill="#95a5a6"/>
                            <rect x="65" y="33" width="5" height="35" fill="#95a5a6"/>
                            <path d="M35 45 L35 20 Q35 15 40 15 L50 15 Q55 15 55 20 L55 45 Z" fill="#34495e"/>
                            <rect x="40" y="45" width="4" height="25" fill="#2c3e50"/>
                            <rect x="50" y="45" width="4" height="25" fill="#2c3e50"/>
                        </svg>
                        <span class="example-img-label">책상과 걸상</span>
                    </div>
                </td>
                <td>
                    <div class="example-text-tech">이미지 인식<br>문자 인식</div>
                </td>
                <td>
                    <div class="example-text-desc">
                        • 내가 앉으면 높이를 조절해 준다.<br>
                        • 책상 위에 놓인 책을 펼치면 읽어 준다.
                    </div>
                </td>
            </tr>
            <tr class="input-row">
                <td class="drawing-cell">
                    <div class="drawing-wrapper">
                        <div class="canvas-toolbar">
                            <input type="color" class="color-picker" id="colorPicker" value="#000000" onchange="changeColor(this.value)">
                            <button type="button" class="toolbar-btn pen-btn active" onclick="setMode('pen')">✏️ 펜</button>
                            <button type="button" class="toolbar-btn eraser-btn" onclick="setMode('eraser')">🧹 지우개</button>
                            <button type="button" class="toolbar-btn" onclick="clearCanvas()">🗑️ 전체 지우기</button>
                        </div>
                        <canvas id="drawingCanvas" width="230" height="250"></canvas>
                    </div>
                </td>
                <td class="text-cell">
                    <textarea id="inputTech" class="text-input-area" placeholder="적용할 인공지능 기술을 적어보세요.&#10;&#10;(예: 음성 인식)"></textarea>
                </td>
                <td class="text-cell">
                    <textarea id="inputDesc" class="text-input-area" placeholder="인공지능 기술이 적용되면 어떤 점이 편리해지는지 자유롭게 적어보세요."></textarea>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="action-bar">
        <button type="button" class="submit-btn" onclick="submitData()">구글 스프레드시트로 제출하기</button>
    </div>
</div>

<script>
    // ⚠️ 아래에 복사한 구글 앱스 크립트 웹앱 URL을 넣으세요.
    const GAS_URL = "https://script.google.com/macros/library/d/1mTS0gauwxTWBgbZQcjm0nAuN3NSjQKjvPVjXdEc43K_dhZXf-c-hs35k/1";

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentMode = 'pen';
    let currentColor = '#000000';

    window.onload = function() {
        // 백그라운드 흰색 채우기
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 터치 및 마우스 이벤트
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY }));
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY }));
        }, { passive: false });

        canvas.addEventListener('touchend', stopDrawing);
    };

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDrawing(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getPos(e);

        if (currentMode === 'pen') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        } else {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 18;
            ctx.lineCap = 'round';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }
    }

    function stopDrawing() {
        if (isDrawing) {
            isDrawing = false;
            ctx.beginPath();
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelector('.pen-btn').classList.toggle('active', mode === 'pen');
        document.querySelector('.eraser-btn').classList.toggle('active', mode === 'eraser');
    }

    function changeColor(color) {
        currentColor = color;
        setMode('pen');
    }

    function clearCanvas() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function submitData() {
        const school = document.getElementById('school').value.trim();
        const grade = document.getElementById('grade').value.trim();
        const classNum = document.getElementById('classNum').value.trim();
        const name = document.getElementById('name').value.trim();
        const tech = document.getElementById('inputTech').value.trim();
        const desc = document.getElementById('inputDesc').value.trim();

        if (!name) {
            alert("이름을 입력해주세요!");
            return;
        }

        if (GAS_URL === "YOUR_GAS_WEB_APP_URL_HERE" || !GAS_URL) {
            alert("스프레드시트 연동 URL이 설정되지 않았습니다. 코드 내부의 GAS_URL 값을 확인해 주세요.");
            return;
        }

        const drawingData = canvas.toDataURL('image/png');

        const payload = {
            school: school,
            grade: grade,
            classNum: classNum,
            name: name,
            drawing: drawingData,
            tech: tech,
            desc: desc
        };

        const btn = document.querySelector('.submit-btn');
        btn.innerText = "제출 중...";
        btn.disabled = true;

        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("선생님께 성공적으로 제출되었습니다!");
            btn.innerText = "제출 완료";
        })
        .catch(err => {
            console.error(err);
            alert("제출 중 오류가 발생했습니다.");
            btn.innerText = "구글 스프레드시트로 제출하기";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
